[package]
name = "keirost-setup"
description = "Asistente de instalación de Keirost"
# Número propio y no el del workspace: el instalador se publica solo, a su
# ritmo, y es el único cuya versión ve un cliente. Se sube a mano al preparar
# una publicación; de aquí salen tanto el ejecutable como la etiqueta de la
# release y lo que el asistente compara para saber si hay uno más nuevo.
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Con dos binarios, `cargo run` (y con él `tauri dev`) no sabe cuál lanzar.
# El asistente es el que se abre; la consola se invoca por su nombre.
default-run = "keirost-setup"

[lib]
name = "keirost_setup"
path = "src/lib.rs"

[[bin]]
name = "keirost-setup"
path = "src/main.rs"
test = false

# El mismo instalador, con otra piel. Son dos ejecutables y no uno porque el
# subsistema de Windows se fija al enlazar y vale para todo el proceso: el
# asistente tiene que ser de ventana y la interfaz de consola, de consola.
# Está explicado en tests/subsistema.rs.
[[bin]]
name = "keirost-cli"
path = "src/cli.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keirost-core = { path = "../../../crates/keirost-core" }
keirost-svc = { path = "../../../crates/keirost-svc" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
time = { version = "0.3", features = ["formatting", "local-offset"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.0.0-rc.5"

[dev-dependencies]
tempfile = "3"
