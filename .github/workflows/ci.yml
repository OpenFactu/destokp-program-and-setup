name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # El de rust-toolchain.toml. Las actions van fijadas por commit: una etiqueta se
  # puede mover, y estos trabajos publican lo que luego corre como administrador.
  RUST_VERSION: 1.99.1
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Para entender un fallo de las pruebas de puertos: los bloques reservados
      # cambian de una imagen de runner a otra.
      - name: Puertos que Windows tiene reservados
        run: netsh interface ipv4 show excludedportrange protocol=tcp

      - name: Pruebas
        run: cargo test --workspace

      # Los runners de GitHub corren como administrador, así que aquí sí se
      # puede registrar servicios de verdad: es la única forma de comprobar que
      # el ciclo instalar → arrancar → parar → desinstalar funciona.
      - name: Pruebas que necesitan administrador
        run: cargo test --workspace -- --ignored --test-threads=1

  interfaz:
    name: Interfaces y herramientas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 22 y no 20: el runner sólo ejecuta las herramientas del repositorio, y
      # las versiones nuevas del runtime de prueba de Node ahorran andamiaje.
      # El Node que se empaqueta con Keirost lo fija el manifest, aparte.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas de las herramientas del pipeline
        run: npm test

      - name: Tipos
        run: npm run typecheck

      - name: Compilar las interfaces
        run: npm run build
