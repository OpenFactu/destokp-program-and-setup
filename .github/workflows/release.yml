name: Publicar instalador

# Compila y publica «Keirost Setup» y «Keirost» (escritorio). La web que va
# dentro de la aplicación se toma de una release de artefactos ya publicada, de
# modo que instalador y contenido siempre son una pareja conocida.

on:
  workflow_dispatch:
    inputs:
      keirost_version:
        description: 'Versión de artefactos de Keirost que se empaqueta en la aplicación'
        required: true
      publish:
        description: 'Publicar la release'
        type: boolean
        default: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Generar los iconos
        run: npm run icons

      # Sin esto la aplicación arrancaría sin web dentro y dependería de que el
      # servidor sirviera la suya.
      - name: Empaquetar la web de Keirost en la aplicación
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "keirost-v${{ inputs.keirost_version }}"
          $destino = "apps/desktop/src-tauri/keirost-web"
          New-Item -ItemType Directory -Force $destino | Out-Null
          gh release download $tag --pattern "keirost-web-*.zip" --dir "$env:RUNNER_TEMP"
          $zip = Get-ChildItem "$env:RUNNER_TEMP/keirost-web-*.zip" | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath $destino -Force
          if (-not (Test-Path "$destino/index.html")) {
            throw "El artefacto de la web no trae index.html"
          }

      # El orden importa: «Keirost Setup» empaqueta dentro los demás binarios
      # (los servicios y la propia aplicación de escritorio), así que tienen que
      # existir antes de bundlearlo o el bundler aborta por recurso ausente.
      - name: Compilar los binarios de servicio y la consola
        run: cargo build --release -p keirost-service-host -p keirost-web-server -p keirost-setup

      - name: Compilar Keirost (escritorio)
        run: npm run desktop:build

      # `--config` y no la configuración de siempre: declarar ahí los binarios
      # obligaría a tenerlos compilados para cualquier `cargo build`, porque
      # tauri-build comprueba que los recursos existen al compilar la caja. La
      # CI y las pruebas dejarían de funcionar sin haber pasado antes por aquí.
      - name: Compilar Keirost Setup con todo dentro
        run: npm run setup:build -- --config src-tauri/tauri.release.conf.json

      # Un instalador al que le falte parte de su carga se instala sin ruido y
      # falla en casa del cliente, que es donde más caro sale.
      #
      # Se comprueba instalándolo de verdad y mirando qué deja, no listando el
      # .exe: un NSIS no siempre se deja enumerar desde fuera, y lo que importa
      # no es lo que lleva dentro sino lo que acaba en el disco.
      - name: Comprobar que el instalador deja todo en su sitio
        run: |
          $nsis = Get-ChildItem -Recurse target/release/bundle/nsis/*.exe |
            Where-Object Name -like 'Keirost Setup*' | Select-Object -First 1
          $destino = Join-Path $env:RUNNER_TEMP 'prueba-instalador'
          Remove-Item $destino -Recurse -Force -ErrorAction SilentlyContinue

          # /S: sin interfaz. /D: dónde, y tiene que ir el último y sin comillas.
          $proceso = Start-Process $nsis.FullName -ArgumentList "/S", "/D=$destino" -Wait -PassThru
          if ($proceso.ExitCode -ne 0) {
            throw "«$($nsis.Name)» falló al instalar (código $($proceso.ExitCode))"
          }

          # Por si el instalador deja el asistente abierto al terminar: sin esto
          # se queda una ventana sujetando ficheros el resto del job.
          Get-Process keirost-setup -ErrorAction SilentlyContinue | Stop-Process -Force

          Write-Host "Instalado en $destino :"
          Get-ChildItem $destino -Recurse -File | ForEach-Object {
            Write-Host ("  {0}" -f $_.FullName.Substring($destino.Length + 1))
          }

          foreach ($pieza in @(
            'keirost-setup.exe',
            'keirost-service-host.exe',
            'keirost-web-server.exe',
            'keirost-cli.exe',
            'keirost-desktop.exe',
            'keirost-web\index.html'
          )) {
            if (-not (Test-Path (Join-Path $destino $pieza))) {
              throw "«$($nsis.Name)» no deja $pieza al instalarse"
            }
          }
          Write-Host 'El instalador deja su carga completa'

      - name: Recoger los instaladores
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem -Recurse target/release/bundle/nsis/*.exe | Copy-Item -Destination dist
          # Los binarios sueltos también se publican: el instalador los copia a
          # «bin\», y tenerlos aparte facilita diagnosticar sin desempaquetar.
          Copy-Item target/release/keirost-service-host.exe dist
          Copy-Item target/release/keirost-web-server.exe dist
          # La interfaz de consola se publica suelta a propósito: es la que
          # necesita quien despliega Keirost con un script en varios equipos.
          Copy-Item target/release/keirost-cli.exe dist
          Get-ChildItem dist | Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ inputs.keirost_version }}
          path: dist/

      - name: Publicar
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "setup-v${{ inputs.keirost_version }}"
          $ficheros = Get-ChildItem dist | ForEach-Object { $_.FullName }

          # Volver a compilar el instalador para la misma versión de Keirost es
          # normal: el arreglo puede estar en el instalador y no en el ERP. Antes
          # eso moría al crear una etiqueta que ya existía, así que se
          # reemplazan los ficheros en la release que hay en vez de exigir un
          # número nuevo que no significaría nada.
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "«$tag» ya existe: se reemplazan sus ficheros"
            gh release upload $tag $ficheros --clobber
            exit 0
          }

          # `--latest=false` no es cosmética: el canal estable del instalador lee
          # su manifest de /releases/latest/download/manifest.json, y esa URL
          # apunta a la release más reciente del repo entero. Publicar el
          # instalador como «latest» se lo robaba a los artefactos y dejaba a
          # todos los asistentes ya instalados con un 404 al elegir versión.
          gh release create $tag $ficheros `
            --title "Keirost Setup ${{ inputs.keirost_version }}" `
            --notes "Instalador de Keirost ${{ inputs.keirost_version }} para Windows." `
            --latest=false
