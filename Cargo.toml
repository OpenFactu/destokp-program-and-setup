[workspace]
resolver = "2"
members = [
    "crates/keirost-core",
    "crates/keirost-svc",
    "crates/keirost-service-host",
    "crates/keirost-web-server",
    "apps/setup/src-tauri",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OpenFactu/destokp-program-and-setup"
rust-version = "1.77"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
